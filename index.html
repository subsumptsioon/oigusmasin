<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rehkendaja | Õigusmasin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="noir.css" />
    <style>
      /* ── Page-specific styles ── */

      /* Highlight overlay container — mirror div sizes it, textarea overlays */
      .input-wrap {
        position: relative;
        pointer-events: auto;
      }
      /* A11y (WCAG 2.4.7): visible focus for the borderless textarea */
      .input-wrap:focus-within {
        outline: 1px solid var(--amber);
        outline-offset: 2px;
        border-radius: 2px;
      }

      /* The mirror div — drives height; textarea overlaid on top */
      .input-highlight {
        display: block;
        box-sizing: border-box;
        width: 100%;
        min-height: 120px;
        padding: 16px;
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.7;
        color: transparent;
        white-space: pre-wrap;
        word-wrap: break-word;
        word-break: break-word;
        cursor: text;
      }

      .input-highlight mark {
        background: rgba(245, 185, 66, 0.28);
        color: transparent;
        border-radius: 2px;
        outline: 1px solid rgba(245, 185, 66, 0.5);
        padding: 0;
        pointer-events: auto;
        cursor: pointer;
      }
      .input-highlight mark.excluded {
        background: rgba(122, 132, 168, 0.12);
        outline: 1px solid rgba(122, 132, 168, 0.25);
        text-decoration: line-through;
      }
      .reset-btn {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        letter-spacing: 0.06em;
        transition: color 0.12s;
        display: none;
      }
      .reset-btn:hover {
        color: var(--amber);
      }
      .reset-btn.visible {
        display: inline;
      }
      .el-excluded {
        opacity: 0.35;
        text-decoration: line-through;
      }

      #input-text {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        background: transparent;
        border: none;
        color: var(--text);
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.7;
        padding: 16px;
        resize: none;
        outline: none;
        caret-color: var(--amber);
        overflow: hidden;
        pointer-events: auto;
      }
      #input-text::placeholder {
        color: var(--dim);
      }

      /* Results panel */
      /* results-panel / result-header / result-label live in noir.css */
      .result-value {
        font-family: var(--mono);
        padding: 16px 20px;
        font-size: 15px;
        color: var(--text);
        line-height: 1.6;
      }

      /* Sum value — larger */
      .sum-value {
        font-family: var(--mono);
        font-size: 32px;
        font-weight: 700;
        color: var(--amber);
        letter-spacing: -0.02em;
        padding: 20px 20px;
      }

      /* Count */
      .count-value {
        font-family: var(--mono);
        font-size: 24px;
        font-weight: 700;
        color: var(--text);
        padding: 16px 20px;
      }

      /* Ordered list of elements */
      .elements-list {
        padding: 14px 20px;
        margin: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .elements-list li {
        font-family: var(--mono);
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 14px;
        color: var(--text);
        padding: 7px 0;
        border-bottom: 1px solid var(--border);
      }
      .elements-list li:last-child {
        border-bottom: none;
      }

      .el-num {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        width: 28px;
        text-align: right;
        flex-shrink: 0;
      }

      /* Empty state */
      .empty-state {
        font-family: var(--mono);
        padding: 40px 16px;
        text-align: center;
        color: var(--dim);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      /* Unit switcher */
      .unit-switcher {
        display: flex;
        border: 1px solid var(--border);
        overflow: hidden;
        flex-shrink: 0;
      }
      .unit-btn {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.1em;
        padding: 6px 16px;
        background: none;
        border: none;
        color: var(--dim);
        cursor: pointer;
        transition:
          background 0.12s,
          color 0.12s;
        border-right: 1px solid var(--border);
      }
      .unit-btn:last-child {
        border-right: none;
      }
      .unit-btn:hover {
        background: var(--lift);
        color: var(--text);
      }
      .unit-btn.active {
        background: var(--surface);
        color: var(--amber);
      }
    </style>
  </head>
  <body>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="app-shell">
      <!-- ── SIDEBAR ── -->
      <nav class="sidebar" id="sidebar"></nav>

      <!-- ── PAGE CONTENT ── -->
      <div class="page-content">
        <div class="topbar">
          <div class="header-main">
            <button
              class="sidebar-toggle"
              id="sidebar-toggle"
              aria-label="Ava menüü"
            >
              ☰
            </button>
            <div class="title-block">
              <h1>Rehkendaja</h1>
              <div class="subtitle">
                <span class="subtitle-label"
                  >Tuvastab ja liidab tekstis leiduvad arvud (ei arvesta
                  miinusmärke)</span
                >
              </div>
            </div>
          </div>
        </div>

        <main>
          <div class="tool-wrap">
            <!-- Input -->
            <div class="panel">
              <div class="panel-header panel-header-row">
                <span>// Sisesta tekst</span>
                <div class="unit-switcher">
                  <button class="unit-btn active" id="btn-eur">€ euro</button>
                  <button class="unit-btn" id="btn-g">g gramm</button>
                  <button class="unit-btn" id="btn-n">∑ kõik arvud</button>
                </div>
              </div>
              <div class="input-wrap">
                <div
                  class="input-highlight"
                  id="input-highlight"
                  aria-hidden="true"
                ></div>
                <textarea
                  id="input-text"
                  placeholder="Sisesta siia tekst, mis sisaldab arve."
                  spellcheck="false"
                  tabindex="1"
                ></textarea>
              </div>
            </div>

            <!-- Results -->
            <div class="results-panel" id="results-panel">
              <!-- Sum -->
              <div class="result-block animate" id="block-sum">
                <div class="result-header">
                  <span class="result-label">// Hulga summa</span>
                  <div style="display: flex; align-items: center; gap: 12px">
                    <button class="reset-btn" id="reset-btn">lähtesta</button>
                    <button class="copy-btn" id="copy-sum">
                      Kopeeri summa
                    </button>
                  </div>
                </div>
                <div class="sum-value" id="val-sum">0</div>
              </div>

              <!-- Count -->
              <div class="result-block animate" id="block-count">
                <div class="result-header">
                  <span class="result-label">// Hulga elementide arv</span>
                </div>
                <div class="count-value" id="val-count">0</div>
              </div>

              <!-- List -->
              <div class="result-block animate" id="block-list">
                <div class="result-header">
                  <span class="result-label">// Hulga elemendid</span>
                  <button class="copy-btn" id="copy-list">
                    Kopeeri nimekiri
                  </button>
                </div>
                <ol class="elements-list" id="val-list">
                  <li style="color: var(--dim)">–</li>
                </ol>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="rehkendaja-core.js"></script>
    <script src="nav.js"></script>
    <script>
      // ── Unit mode ───────────────────────────────────────────────────────────────
      const btnEur = document.getElementById("btn-eur");
      const btnG = document.getElementById("btn-g");
      const btnN = document.getElementById("btn-n");
      const inputEl = document.getElementById("input-text");
      const highlightEl = document.getElementById("input-highlight");
      const inputWrap = document.querySelector(".input-wrap");

      btnEur.addEventListener("click", () => setMode("eur"));
      btnG.addEventListener("click", () => setMode("g"));
      btnN.addEventListener("click", () => setMode("n"));

      function setMode(m) {
        mode = m;
        btnEur.classList.toggle("active", m === "eur");
        btnG.classList.toggle("active", m === "g");
        btnN.classList.toggle("active", m === "n");
        update();
      }

      // ── Highlight mirror ────────────────────────────────────────────────────────
      inputEl.addEventListener("scroll", () => {
        highlightEl.scrollTop = inputEl.scrollTop;
        highlightEl.scrollLeft = inputEl.scrollLeft;
      });

      inputEl.addEventListener("click", (e) => {
        const cp =
          document.caretPositionFromPoint?.(e.clientX, e.clientY) ??
          document.caretRangeFromPoint?.(e.clientX, e.clientY);
        if (!cp) return;
        const offset = cp.offset ?? cp.startOffset;
        const hit = lastFound.findIndex(
          (m) => offset >= m.index && offset < m.index + m.matchLen,
        );
        if (hit !== -1) toggleExclude(hit);
      });

      const ESC_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;" };
      // Single-pass escape (one regex scan instead of three sequential replaces)
      function escHtml(s) {
        return s.replace(/[&<>]/g, (c) => ESC_MAP[c]);
      }

      // Improvement #1 — clean highlight builder (array push + join)
      function buildHighlightHtml(text, matches) {
        if (!matches.length) return escHtml(text);

        const parts = [];
        let cursor = 0;

        matches.forEach((m, i) => {
          if (m.index > cursor) {
            parts.push(escHtml(text.slice(cursor, m.index)));
          }
          const cls = excluded.has(i) ? ' class="excluded"' : "";
          parts.push(
            `<mark${cls} data-idx="${i}">${escHtml(
              text.slice(m.index, m.index + m.matchLen),
            )}</mark>`,
          );
          cursor = m.index + m.matchLen;
        });

        if (cursor < text.length) {
          parts.push(escHtml(text.slice(cursor)));
        }

        return (
          parts.join("") +
          (text.endsWith("\n") ? " " : "") +
          "<span></span>"
        ); // prevents trailing-mark collapse
      }

      function toggleExclude(idx) {
        if (excluded.has(idx)) excluded.delete(idx);
        else excluded.add(idx);
        renderResults();
      }

      // ── Render ──────────────────────────────────────────────────────────────────
      const valSum = document.getElementById("val-sum");
      const valCount = document.getElementById("val-count");
      const valList = document.getElementById("val-list");
      const resetBtn = document.getElementById("reset-btn");
      const copySumBtn = document.getElementById("copy-sum");
      const copyListBtn = document.getElementById("copy-list");
      // Delegated click — one listener for all <li data-idx> (not one per <li>)
      valList.addEventListener("click", (e) => {
        const li = e.target.closest("li[data-idx]");
        if (li) toggleExclude(Number(li.dataset.idx));
      });

      let lastFound = [];
      let excluded = new Set();

      function update() {
        const text = inputEl.value;
        // Index previous exclusions by raw text -> [original index, ...]
        const prevByRaw = new Map();
        for (const i of excluded) {
          const p = lastFound[i];
          if (!p) continue;
          const arr = prevByRaw.get(p.raw);
          if (arr) arr.push(p.index);
          else prevByRaw.set(p.raw, [p.index]);
        }
        lastFound = extractAmounts(text);
        excluded.clear();
        lastFound.forEach((m, i) => {
          const idxs = prevByRaw.get(m.raw);
          if (!idxs) return;
          // a previously-excluded match at a small position shift re-excludes this one
          if (idxs.some((pIdx) => Math.abs(pIdx - m.index) <= 10)) excluded.add(i);
        });
        renderResults();
      }

      function renderResults() {
        const text = inputEl.value;
        const active = lastFound.filter((_, i) => !excluded.has(i));
        const hasText = !!text.trim();

        highlightEl.innerHTML = buildHighlightHtml(text, lastFound);
        highlightEl.scrollTop = inputEl.scrollTop;

        resetBtn.classList.toggle("visible", excluded.size > 0);

        if (!hasText) {
          valSum.textContent = "0";
          valCount.textContent = "0";
          valList.innerHTML = '<li style="color:var(--dim)">–</li>';
          return;
        }

        const maxDec = active.reduce((m, x) => Math.max(m, x.decimals), 0);
        const total = active.reduce((acc, x) => acc + x.amount, 0);

        valSum.textContent = active.length
          ? formatValue(total, maxDec)
          : formatValue(0, 0);

        valCount.textContent =
          active.length + (excluded.size > 0 ? " / " + lastFound.length : "");

        valList.innerHTML = "";
        if (lastFound.length === 0) {
          const li = document.createElement("li");
          li.style.cssText =
            "color:var(--dim);font-size:12px;letter-spacing:0.1em";
          li.textContent = "// ühtegi elementi ei leitud";
          valList.appendChild(li);
        } else {
          lastFound.forEach((item, i) => {
            const li = document.createElement("li");
            const isExcluded = excluded.has(i);
            li.className = isExcluded ? "el-excluded" : "";
            li.style.cursor = "pointer";
            li.title = isExcluded
              ? "Kliki, et lisada tagasi"
              : "Kliki, et eemaldada";
            li.dataset.idx = i;
            li.innerHTML =
              `<span class="el-num">${String(i + 1).padStart(2, "0")}</span>` +
              formatValue(item.amount, item.decimals);
            valList.appendChild(li);
          });
        }
      }

      // Improvement #2 — debounced input
      let updateTimer = null;
      inputEl.addEventListener("input", () => {
        clearTimeout(updateTimer);
        updateTimer = setTimeout(update, 80);
      });

      // ── Copy buttons ────────────────────────────────────────────────────────────
      function copyText(btn, text) {
        // Improvement #5 — prevent spam
        if (btn.classList.contains("copied")) return;

        navigator.clipboard.writeText(text).then(() => {
          btn.classList.add("copied");
          const orig = btn.textContent;
          btn.textContent = "Kopeeritud ✓";
          setTimeout(() => {
            btn.textContent = orig;
            btn.classList.remove("copied");
          }, 1800);
        });
      }

      copySumBtn.addEventListener("click", () => {
        copyText(copySumBtn, valSum.textContent);
      });

      copyListBtn.addEventListener("click", () => {
        const text = lastFound
          .filter((_, i) => !excluded.has(i))
          .map((x) => formatNumeric(x.amount, x.decimals))
          .join("\n");
        copyText(copyListBtn, text);
      });

      // ── Reset exclusions ────────────────────────────────────────────────────────
      document.getElementById("reset-btn").addEventListener("click", () => {
        excluded.clear();
        renderResults();
      });

      // ── Bootstrap ───────────────────────────────────────────────────────────────
      document
        .querySelectorAll(".footer-year")
        .forEach((el) => (el.textContent = new Date().getFullYear()));
    </script>
  </body>
</html>
