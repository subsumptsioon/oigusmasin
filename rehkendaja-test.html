<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rehkendaja — testid</title>
    <link rel="stylesheet" href="noir.css" />
  </head>
  <body class="test-harness">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="app-shell">
      <nav class="sidebar" id="sidebar"></nav>

      <div class="page-content">
        <div class="topbar">
          <div class="header-chrome"></div>
          <div class="header-main">
            <button
              class="sidebar-toggle"
              id="sidebar-toggle"
              aria-label="Ava menüü"
            >
              ☰
            </button>
            <div class="title-block">
              <h1>Rehkendaja testid</h1>
              <div class="subtitle">
                <span class="subtitle-label"
                  >rehkendaja-core.js — automaattestid</span
                >
              </div>
            </div>
          </div>
        </div>

        <main id="output">
          <p style="color: var(--muted); font-size: var(--fs-sm)">
            // testid käivituvad…
          </p>
        </main>

        <footer></footer>
      </div>
    </div>

    <script src="rehkendaja-core.js"></script>
    <script src="nav.js"></script>
    <script>
      // ── Sidebar ───────────────────────────────────────────────────────────────────
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      const togBtn = document.getElementById("sidebar-toggle");
      togBtn.addEventListener("click", () =>
        sidebar.classList.contains("open")
          ? (sidebar.classList.remove("open"),
            overlay.classList.remove("visible"))
          : (sidebar.classList.add("open"), overlay.classList.add("visible")),
      );
      overlay.addEventListener("click", () => {
        sidebar.classList.remove("open");
        overlay.classList.remove("visible");
      });
      document
        .querySelectorAll(".footer-year")
        .forEach((el) => (el.textContent = new Date().getFullYear()));

      // ── Test harness ──────────────────────────────────────────────────────────────
      const suites = [];
      let currentSuite = null;

      function suite(name, fn) {
        currentSuite = { name, tests: [] };
        suites.push(currentSuite);
        fn();
      }

      // Every matcher funnels through record() so a failure always carries a
      // printable "got"/"expected" pair.
      function record(pass, got, expected, label) {
        currentSuite.tests.push({
          pass,
          label: label || "",
          got: pass ? null : got,
          expected: pass ? null : expected,
        });
      }

      // Partial deep compare: every key in `expected` must match in `actual`,
      // extra keys in `actual` are ignored. Unlike toEqual this does not care
      // about key order, so an extractAmounts record can be asserted by name.
      function deepMatches(actual, expected) {
        if (expected === null || typeof expected !== "object") {
          return JSON.stringify(actual) === JSON.stringify(expected);
        }
        if (actual === null || typeof actual !== "object") return false;
        return Object.keys(expected).every(
          (k) =>
            Object.prototype.hasOwnProperty.call(actual, k) &&
            deepMatches(actual[k], expected[k]),
        );
      }

      // expect(actual, label)
      //   .toEqual(expected)         strict JSON equality
      //   .toBeCloseTo(expected, dp) rounded comparison
      //   .toBeNull()
      //   .toBeTruthy() / .toBeFalse()
      //   .toHaveLength(n)          array or string length
      //   .toContain(sub)           substring, or array member
      //   .toMatchFields(expected)  partial deep compare, key-order agnostic
      function expect(actual, label) {
        const lbl = label || "";
        const j = (v) => JSON.stringify(v);
        return {
          toEqual(expected) {
            const pass = j(actual) === j(expected);
            record(pass, j(actual), j(expected), lbl);
          },
          toBeCloseTo(expected, dp = 6) {
            const factor = Math.pow(10, dp);
            const pass =
              Math.round(actual * factor) === Math.round(expected * factor);
            record(pass, actual, expected, lbl);
          },
          toBeNull() {
            record(actual === null, j(actual), "null", lbl);
          },
          toBeLessThan(n) {
            record(actual < n, actual, `< ${n}`, lbl);
          },
          toBeTruthy() {
            record(!!actual, j(actual), "truthy", lbl);
          },
          toBeFalse() {
            record(actual === false, j(actual), "false", lbl);
          },
          toHaveLength(n) {
            const len = actual == null ? -1 : actual.length;
            record(len === n, len, n, lbl);
          },
          toContain(sub) {
            const hit = Array.isArray(actual)
              ? actual.includes(sub)
              : String(actual).includes(sub);
            record(hit, j(actual), j(sub), lbl);
          },
          toMatchFields(expected) {
            const pass = deepMatches(actual, expected);
            record(pass, j(actual), j(expected), lbl);
          },
        };
      }

      // ── Helpers ───────────────────────────────────────────────────────────────────
      // extract amounts in a given mode from a string
      function detect(text, m) {
        mode = m;
        return extractAmounts(text);
      }
      function amounts(text, m) {
        return detect(text, m).map((x) => x.amount);
      }
      function sum(text, m) {
        return detect(text, m).reduce((a, x) => a + x.amount, 0);
      }
      function raws(text, m) {
        return detect(text, m).map((x) => x.raw);
      }
      function setMode(m) {
        mode = m;
      }

      // Shared corpus for the property-style suites: realistic Estonian legal
      // phrasing, plus the shapes that have historically confused the patterns
      // (dates, case numbers, word ranges, adjacent amounts, bare signs).
      const CORPUS = [
        "Süüdistatud sai 1 234,56 € ja 89,50 € kokku.",
        "Kaalutud oli 0,5g heroiini ja 1,2g kokaiini.",
        "Kokku 12 345,67 eurot.",
        "Leidsin 7 asja ja 3 raamatut.",
        "Maksime 3000. Seejärel 4000.",
        "Summa 4500. Teine summa 3200.",
        "punktid 1. 2. ja 3.",
        "Kahest hulgast 500 € ja 250 €",
        "hind on 0,99 €",
        "Tegemist on 300 grammi ainega",
        "grammides 1000,001g",
        "3,14g kokaiini ja 12 grammi amfetamiini",
        "kuupäev 12.03.2024 ja 14:30",
        "nr 1-23/456",
        "alates 01.01.2024 kehtib",
        "vahemikus 10.01-10.02",
        "majandusaasta 2024-2025",
        "artikkel 5-6 leppet",
        "telefon 555-1234",
        "COVID-19",
        "märkus nr 42.",
        "x500",
        "-50 € kahjulik kulu",
        "50 € ja -50 € tühistuvad",
        "(50 €)",
        "a & b 100 €",
        "",
        "   ",
      ];

      // A match in eur/g mode must carry its unit. Kept as data so the
      // property suite stays independent of the regex sources.
      const UNIT_TOKEN = {
        eur: /€|eur|euro|eurot/i,
        g: /(^|\s)(g\.?|gramm\w*)\b|\b(gramm\w*)\b(\s|$)/i,
      };

      // ═════════════════════════════════════════════════════════════════════════════
      // SUITES
      // ═════════════════════════════════════════════════════════════════════════════

      // ── parseAmount ───────────────────────────────────────────────────────────────
      suite("parseAmount — number normalisation", () => {
        expect(parseAmount("1234"), "integer").toEqual(1234);
        expect(parseAmount("1234,56"), "comma decimal").toEqual(1234.56);
        expect(parseAmount("1234.56"), "dot decimal").toEqual(1234.56);
        expect(
          parseAmount("1 234,56"),
          "space thousands, comma decimal",
        ).toEqual(1234.56);
        expect(parseAmount("1.234,56"), "dot thousands, comma decimal").toEqual(
          1234.56,
        );
        expect(parseAmount("1,234.56"), "comma thousands, dot decimal").toEqual(
          1234.56,
        );
        expect(parseAmount("0,0002"), "small decimal").toBeCloseTo(0.0002, 6);
        expect(parseAmount("0.003"), "small dot decimal").toBeCloseTo(0.003, 6);
        expect(
          parseAmount("1 000,001"),
          "large with many decimals",
        ).toBeCloseTo(1000.001, 6);
        expect(parseAmount("abc"), "non-numeric → null").toBeNull();
        expect(parseAmount(""), "empty → null").toBeNull();
      });

      // ── countDecimals ─────────────────────────────────────────────────────────────
      suite("countDecimals", () => {
        expect(countDecimals("42"), "integer").toEqual(0);
        expect(countDecimals("1,56"), "comma 2dp").toEqual(2);
        expect(countDecimals("1.56"), "dot 2dp").toEqual(2);
        expect(
          countDecimals("1.234,56"),
          "dot-thousands comma-decimal",
        ).toEqual(2);
        expect(countDecimals("0,0002"), "4dp").toEqual(4);
        expect(countDecimals("1 000,001"), "3dp with space").toEqual(3);
      });

      // ── EURO_RE extraction ────────────────────────────────────────────────────────
      suite("Euro — detection", () => {
        expect(amounts("1 234,56 €", "eur"), "number then €").toEqual([
          1234.56,
        ]);
        expect(amounts("€ 1234.56", "eur"), "€ then number").toEqual([1234.56]);
        expect(amounts("EUR 500", "eur"), "EUR prefix").toEqual([500]);
        expect(amounts("75,00 eurot", "eur"), "eurot suffix").toEqual([75]);
        expect(amounts("1.234,56 EUR", "eur"), "dot-thousands EUR").toEqual([
          1234.56,
        ]);
        expect(amounts("€350", "eur"), "€ no space").toEqual([350]);
        expect(amounts("89.50 €", "eur"), "dot decimal €").toEqual([89.5]);
        expect(amounts("1 euro", "eur"), "single euro").toEqual([1]);
        expect(amounts("ei ole siin raha", "eur"), "no match").toEqual([]);
        expect(
          amounts("5g ja 10 grammi", "eur"),
          "grams not matched in eur mode",
        ).toEqual([]);
      });

      suite("Euro — sum precision", () => {
        // Sentence-ending periods after numbers cause greedy over-matching ([\d\s.,]* consumes ". ").
        // This test uses realistic court-text phrasing where amounts are followed by words.
        const text =
          "1 234,56 € ning 89.50 € kulud, EUR 500 ja 75,00 eurot ning €350 ja 1.234,56 EUR";
        expect(sum(text, "eur"), "integration sum").toBeCloseTo(3483.62, 2);
        expect(detect(text, "eur").length, "count").toEqual(6);
      });

      suite("Euro — should NOT detect", () => {
        expect(
          amounts("0,0002g fentanüüli", "eur"),
          "gram suffix not euro",
        ).toEqual([]);
        expect(amounts("nr 1-23/456", "eur"), "case number not euro").toEqual(
          [],
        );
      });

      // ── GRAM_RE extraction ────────────────────────────────────────────────────────
      suite("Gram — detection", () => {
        expect(amounts("0,5g", "g"), "no space").toEqual([0.5]);
        expect(amounts("1.2g", "g"), "dot decimal").toEqual([1.2]);
        expect(amounts("12 grammi", "g"), "grammi").toEqual([12]);
        expect(amounts("1 gramm", "g"), "gramm singular").toEqual([1]);
        expect(amounts("0,0002g", "g"), "very small").toBeCloseTo(0.0002, 6);
        expect(amounts("0.003g", "g"), "dot tiny").toBeCloseTo(0.003, 6);
        expect(
          amounts("1 000,001g", "g"),
          "space-thousands comma-decimal",
        ).toBeCloseTo(1000.001, 6);
        expect(amounts("3.14g", "g"), "pi grams").toBeCloseTo(3.14, 6);
        expect(amounts("7g,", "g"), "comma follows").toEqual([7]);
        expect(amounts("2 500g pulbrit", "g"), "space thousands").toEqual([
          2500,
        ]);
        expect(amounts("100 €", "g"), "euro not gram").toEqual([]);
      });

      suite("Gram — sum precision", () => {
        const text =
          "0,5g heroiini. 1.2g kokaiini. 12 grammi amfetamiini. 0,0002g fentanüüli. 1 000,001g. 3.14g. 7g, 0.003g ja 2 500g.";
        expect(sum(text, "g"), "integration sum").toBeCloseTo(3523.8442, 4);
        expect(detect(text, "g").length, "count").toEqual(9);
      });

      suite("Gram — should NOT detect", () => {
        expect(amounts("g 1.5", "g"), "unit before number").toEqual([]);
        expect(amounts("1 234,56 €", "g"), "euro not gram").toEqual([]);
        expect(
          amounts("programm on hea", "g"),
          'gramm inside word "programm"',
        ).toEqual([]);
      });

      // ── NUM_RE extraction ─────────────────────────────────────────────────────────
      suite("Kõik arvud — detection", () => {
        expect(amounts("42", "n"), "plain integer").toEqual([42]);
        expect(amounts("3,14", "n"), "decimal comma").toBeCloseTo(3.14, 6);
        expect(amounts("1 000", "n"), "space thousands").toEqual([1000]);
        expect(amounts("0,0002", "n"), "small decimal").toBeCloseTo(0.0002, 6);
        expect(
          amounts("0,0002g", "n"),
          "number before unit letter",
        ).toBeCloseTo(0.0002, 6);
      });

      suite("Kõik arvud — should NOT double-detect from ranges", () => {
        // "1-23" — hyphen separates, so 1 and 23 may each match; that is acceptable
        // but "1-23/456" should not produce merged garbage numbers
        const res = detect("nr 1-23/456", "n").map((x) => x.amount);
        // Each individual number is fine; just check no absurd values like 123456
        expect(res.every((v) => v <= 1000)).toEqual(
          true,
          "no merged garbage from case numbers",
        );
      });

      // ── Negatives ──────────────────────────────────────────────────────────────────
      // A leading "-" is part of the amount. U+2212 MINUS SIGN counts too,
      // because that is what et-EE formatting emits — the tool has to be able
      // to read back its own output.
      suite("Negatiivsed arvud — märk loetaksesummasse", () => {
        expect(amounts("-50 €", "eur"), "miinusmärk enne €").toEqual([-50]);
        expect(amounts("-50,50 EUR", "eur"), "miinusmärk + komakomata").toEqual([
          -50.5,
        ]);
        expect(amounts("-50€", "eur"), "miinusmärk, tühik puudub").toEqual([-50]);
        expect(amounts("eur -99", "eur"), "sõna enne miinusarvu").toEqual([-99]);
        expect(
          amounts("EUR -1 234,56", "eur"),
          "tuhandega miinusarv",
        ).toEqual([-1234.56]);
        expect(amounts("-0,5g", "g"), "miinus grammides").toEqual([-0.5]);
        expect(amounts("-3 grammi", "g"), "miinus, ühik sõna järel").toEqual([
          -3,
        ]);
        expect(amounts("-50", "n"), "miinusarv lihtrežiimis").toEqual([-50]);
        expect(amounts("-0,001", "n"), "miinus, mitu komakohta").toEqual([
          -0.001,
        ]);
      });

      suite("Negatiivsed arvud — U+2212 ja U+2013", () => {
        // Intl et-EE formats with U+2212, so a value the tool itself produced
        // must parse back as negative.
        expect(amounts("\u221250 EUR", "eur"), "U+2212 loetakse miinusmärgiks")
          .toEqual([-50]);
        expect(amounts("-50 EUR", "eur"), "U+002D miinusmärk").toEqual([-50]);
        // U+2013 EN DASH is a range dash, not a minus: stays positive.
        expect(amounts("\u201350 EUR", "eur"), "U+2013 vahemärk ei ole miinus")
          .toEqual([50]);
      });

      suite("Negatiivsed arvud — märk ei kleepu võõrast sõnast", () => {
        expect(amounts("nr 1-23/456", "eur"), "asjanumber").toEqual([]);
        expect(amounts("COVID-19 EUR", "eur"), "COVID-19 on positiivne").toEqual([
          19,
        ]);
        expect(amounts("-12.03.2024", "n"), "miinusmärgiga kuupäev").toEqual(
          [],
        );
        expect(amounts("12.03.2024", "n"), "kuupäev").toEqual([]);
        expect(amounts("2024-03-12", "n"), "ISO kuupäev").toEqual([]);
        expect(amounts("10.01-10.02", "n"), "kuupäevavahemik").toEqual([]);
        expect(amounts("14:30", "n"), "kellaaeg").toEqual([]);
        expect(amounts("a-50", "n"), "miinusmärk sõna taga").toEqual([]);
        expect(amounts("2024-2025", "n"), "aastavahemik on positiivne").toEqual([
          2024,
        ]);
      });

      suite("Negatiivsed arvud — summad", () => {
        expect(sum("-50 € ja 100 €", "eur"), "lahutamine").toBeCloseTo(50, 6);
        expect(sum("100 € ja -100 €", "eur"), "tühistuvad").toBeCloseTo(0, 6);
        expect(
          sum("-1 234,56 € ja 89,50 €", "eur"),
          "negatiivne summa",
        ).toBeCloseTo(-1145.06, 2);
        expect(sum("-0,5g ja 1,2g", "g"), "grammides").toBeCloseTo(0.7, 6);
      });

      // The letter guard that makes the sign safe also stops an amount from
      // being read out of the middle of a word.
      suite("Negatiivsed arvud — sõna sees ei alustata arvu", () => {
        expect(amounts("x500", "n"), "number tähe järel").toEqual([]);
        expect(amounts("ab12", "n"), "number sõna taga").toEqual([]);
        expect(amounts("telegram 5", "g"), "'gram' sõna sees").toEqual([]);
        expect(amounts("kirogramm 3", "g"), "'gramm' sõna sees").toEqual([]);
        expect(amounts("curseur 5", "eur"), "'eur' sõna sees").toEqual([]);
        expect(amounts("programm 2 g", "g"), "'programm' siiski arv").toEqual([2]);
      });

      suite("Negatiivsed arvud — vormindus", () => {
        mode = "eur";
        // The exact minus character is ICU/browser dependent (U+2212 here), so
        // assert the sign, not the codepoint. A negative that rounds to zero
        // keeps its sign on purpose.
        expect(
          /^[-−]/.test(formatValue(-0.001, 3)),
          "miinusmärk jääb alles ka ümardamisel",
        ).toEqual(true);
        expect(
          formatValue(-0.001, 3),
          "kümnendikuni ümardatud miinussumma",
        ).toEqual(
          (-0.001).toLocaleString("et-EE", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          }) + "\u00A0€",
        );
        expect(formatValue(-50.5, 1).endsWith("\u00A0€"), "ühik U+00A0").toEqual(
          true,
        );
        mode = "g";
        expect(/^[-−]/.test(formatValue(-1234.56, 2)), "grammides miinus").toEqual(
          true,
        );
        mode = "n";
        expect(/^[-−]/.test(formatValue(-50.5, 2)), "lihtrežiimis miinus").toEqual(
          true,
        );
      });

      // ── formatValue ───────────────────────────────────────────────────────────────
      suite("formatValue — eur", () => {
        mode = "eur";
        const loc = (n, d) =>
          n.toLocaleString("et-EE", {
            minimumFractionDigits: d,
            maximumFractionDigits: d,
          });
        expect(formatValue(1234.56, 2), "1234.56 formatted").toEqual(
          loc(1234.56, 2) + "\u00A0€",
        );
        expect(formatValue(500, 0), "500 gets 2dp").toEqual(loc(500, 2) + "\u00A0€");
        expect(formatValue(0, 0), "zero").toEqual(loc(0, 2) + "\u00A0€");
        expect(formatValue(1234.56, 2).endsWith("€"), "ends with €").toEqual(
          true,
        );
        expect(
          formatValue(1234.56, 2).includes(","),
          "uses comma decimal",
        ).toEqual(true);
      });

      suite("formatValue — g", () => {
        mode = "g";
        const loc = (n, d) =>
          n.toLocaleString("et-EE", {
            minimumFractionDigits: 0,
            maximumFractionDigits: d,
          });
        expect(formatValue(0.5, 1), "0.5g").toEqual(loc(0.5, 1) + "\u00A0g");
        expect(formatValue(0.0002, 4), "0.0002g 4dp").toEqual(
          loc(0.0002, 4) + "\u00A0g",
        );
        expect(formatValue(12, 0), "integer grams").toEqual(loc(12, 0) + "\u00A0g");
        expect(formatValue(0.5, 1).endsWith("g"), "ends with g").toEqual(true);
        expect(
          formatValue(1000.001, 3).includes(","),
          "comma decimal in thousands",
        ).toEqual(true);
      });

      suite("formatValue — n", () => {
        mode = "n";
        const loc = (n, d) =>
          n.toLocaleString("et-EE", {
            minimumFractionDigits: 0,
            maximumFractionDigits: d,
          });
        expect(formatValue(42, 0), "integer, no unit").toEqual(loc(42, 0));
        expect(formatValue(3.14, 2), "decimal, no unit").toEqual(loc(3.14, 2));
        expect(
          formatValue(42, 0).endsWith("€") || formatValue(42, 0).endsWith("g"),
          "no unit appended",
        ).toEqual(false);
      });

      // ── Decimal tracking ──────────────────────────────────────────────────────────
      suite("Decimal precision — sum uses maxDecimals of inputs", () => {
        mode = "g";
        const res = detect("1g ja 0,0002g", "g");
        const maxDec = res.reduce((m, x) => Math.max(m, x.decimals), 0);
        expect(maxDec, "maxDec from 0,0002 is 4").toEqual(4);
        const total = res.reduce((a, x) => a + x.amount, 0);
        const expected =
          (1.0002).toLocaleString("et-EE", {
            minimumFractionDigits: 0,
            maximumFractionDigits: 4,
          }) + "\u00A0g";
        expect(formatValue(total, maxDec), "sum formatted to 4dp").toEqual(
          expected,
        );
      });

      // ── Date removal — regressions ────────────────────────────────────────────────
      suite("Kuupäeva eemaldamine — kolm põhirežiimi töötavad", () => {
        expect(
          detect("kokku 12,50 €", "eur").length,
          "eur: üks tulemus",
        ).toEqual(1);
        expect(
          amounts("kokku 12,50 €", "eur")[0],
          "eur: summa 12.5",
        ).toBeCloseTo(12.5, 6);
        expect(detect("kaalub 300 g", "g").length, "g: üks tulemus").toEqual(1);
        expect(amounts("kaalub 300 g", "g")[0], "g: summa 300").toEqual(300);
        expect(detect("leidsin 7 asja", "n").length, "n: üks tulemus").toEqual(
          1,
        );
        expect(amounts("leidsin 7 asja", "n")[0], "n: summa 7").toEqual(7);
      });

      suite(
        "Kuupäeva eemaldamine — kuupäevad ei tuvastata üheski režiimis",
        () => {
          const dateText = "kuupäev 12.03.2024 ja 14:30";
          expect(
            detect(dateText, "eur").length,
            "eur: kuupäev ei sobi",
          ).toEqual(0);
          expect(detect(dateText, "g").length, "g: kuupäev ei sobi").toEqual(0);
          expect(detect(dateText, "n").length, "n: kuupäev ei sobi").toEqual(0);
        },
      );

      suite("Kuupäeva eemaldamine — DATE_RE on kustutatud", () => {
        expect(typeof DATE_RE, "DATE_RE on undefined").toEqual("undefined");
      });

      suite(
        'Kuupäeva eemaldamine — formatValue režiimis "date" tagastab stringi',
        () => {
          mode = "date";
          expect(
            typeof formatValue(42, 0),
            "formatValue tagastab stringi, mitte arvu",
          ).toEqual("string");
          mode = "n"; // restore
        },
      );

      // ═════════════════════════════════════════════════════════════════════════════
      // PROPERTY-STYLE INVARIANTS
      // These run over the whole CORPUS in all three modes. They are written
      // against the shape of the result rather than specific strings, so they
      // keep holding when new cases are added to the corpus.
      // ═════════════════════════════════════════════════════════════════════════════
      const MODES = ["eur", "g", "n"];

      // Strip everything a number is allowed to contain, leaving only the unit.
      function unitRemainder(raw) {
        return raw.replace(/[-\u22120-9.,\u00A0\s]+/g, "");
      }

      suite("Regexi — invariant: raw spans exactly the text it claims", () => {
        for (const m of MODES) {
          for (const text of CORPUS) {
            for (const r of detect(text, m)) {
              expect(
                text.slice(r.index, r.index + r.matchLen),
                `${m}: "${r.raw}" slice == raw`,
              ).toEqual(r.raw);
            }
          }
        }
      });

      suite("Regexi — invariant: matches never overlap and stay in order", () => {
        for (const m of MODES) {
          for (const text of CORPUS) {
            const rs = detect(text, m);
            const ordered = rs.every((r, i) => i === 0 || r.index >= rs[i - 1].index);
            const end = (x) => x.index + x.matchLen;
            const disjoint = rs.every((r, i) => i === 0 || r.index >= end(rs[i - 1]));
            expect(ordered, `${m}: "${text}" indices ascending`).toEqual(true);
            expect(disjoint, `${m}: "${text}" matches disjoint`).toEqual(true);
          }
        }
      });

      suite("Regexi — invariant: amount finite, decimals in range", () => {
        for (const m of MODES) {
          for (const text of CORPUS) {
            for (const r of detect(text, m)) {
              expect(Number.isFinite(r.amount), `${m}: "${r.raw}" finite`).toEqual(
                true,
              );
              expect(
                r.decimals >= 0 && r.decimals <= r.raw.length,
                `${m}: "${r.raw}" decimals ${r.decimals} in range`,
              ).toEqual(true);
            }
          }
        }
      });

      suite("Regexi — invariant: eur/g matches carry their unit", () => {
        const tokens = { eur: /^(€|eur|euro|eurot)$/i, g: /^(g\.?|gramm\w*)$/i };
        for (const m of ["eur", "g"]) {
          for (const text of CORPUS) {
            for (const raw of raws(text, m)) {
              expect(
                tokens[m].test(unitRemainder(raw)),
                `${m}: "${raw}" carries a unit`,
              ).toEqual(true);
            }
          }
        }
      });

      // The three patterns are module-level /g regexes sharing one lastIndex, so a
      // call that left lastIndex dirty would make the next call resume
      // mid-string. Two independent safeguards already prevent that —
      // activeRe() resets it on the way in, and a completed exec loop resets it
      // too (exec returns null at the end) — so this holds by construction and
      // is a defensive pin rather than a currently-falsifiable check: no
      // single-point mutation of rehkendaja-core.js makes it fail. It guards a
      // future refactor that removes both safeguards at once, which would
      // produce a silent, order-dependent bug.
      suite("Regexi — invariant: no state leaks between calls", () => {
        const probe = "1 234,56 € ja 0,5g ja 7 asja ja 2 500,00 €";
        const baseline = JSON.stringify([
          raws(probe, "eur"),
          raws(probe, "g"),
          raws(probe, "n"),
        ]);
        for (let i = 0; i < 5; i++) {
          detect("täiesti muu 999 €", "eur");
          detect("99g", "g");
          detect("12345", "n");
        }
        expect(
          JSON.stringify([
            raws(probe, "eur"),
            raws(probe, "g"),
            raws(probe, "n"),
          ]),
          "results identical after interleaved calls",
        ).toEqual(baseline);
        expect(raws(probe, "eur"), "repeat call is stable").toEqual(
          JSON.parse(baseline)[0],
        );
        // The shared regex must be back at the start after every call.
        for (const m of MODES) {
          detect(probe, m);
          expect(activeRe().lastIndex, `${m}: lastIndex reset after call`).toEqual(
            0,
          );
        }
      });

      suite("Regexi — tühja sisendi servad", () => {
        for (const m of MODES) {
          expect(detect("", m).length, `${m}: tühi string`).toEqual(0);
          expect(detect("   ", m).length, `${m}: ainult tühikud`).toEqual(0);
          expect(detect("\n\t", m).length, `${m}: whitespace`).toEqual(0);
          expect(detect("pole siin arve", m).length, `${m}: ainult tekst`).toEqual(
            0,
          );
        }
      });

      // A digit/comma run with no unit after it makes EURO_RE and G_RE rescan
      // the run from every offset, which is quadratic: measured 26 / 90 / 361 /
      // 1422 / 5669 ms for 4k / 8k / 16k / 32k / 64k characters. The bound below
      // is deliberately far above the ~350 ms that 16k costs today, so it only
      // fires on catastrophic (exponential) blowup; the quadratic case is
      // tracked separately as a known performance issue.
      suite("Regexi — jõudlus: ei ole katastrofaalselt aeglane", () => {
        const run = (text, m) => {
          const t0 = Date.now();
          detect(text, m);
          return Date.now() - t0;
        };
        expect(
          run("1" + ",9".repeat(16000), "eur"),
          "16k-kohaline arvujada, eur",
        ).toBeLessThan(5000);
        expect(
          run("1" + ",9".repeat(16000), "g"),
          "16k-kohaline arvujada, g",
        ).toBeLessThan(5000);
        expect(run("x".repeat(200000) + " 5 EUR", "eur"), "200k märgia").toBeLessThan(
          5000,
        );
        expect(run("1" + "9".repeat(200000), "n"), "200k digit").toBeLessThan(
          5000,
        );
      });

      // ═════════════════════════════════════════════════════════════════════════════
      // PATTERN MATRICES
      // ═════════════════════════════════════════════════════════════════════════════
      suite("EURO_RE — märgi, ühiku ja tühiku kombinatsioonid", () => {
        const cases = [
          ["€ 1234,56", 1234.56],
          ["1234,56 €", 1234.56],
          ["€350", 350],
          ["350€", 350],
          ["€ 1 234,56", 1234.56],
          ["EUR 500", 500],
          ["500 EUR", 500],
          ["eur 500", 500],
          ["500 eur", 500],
          ["Euro 500", 500],
          ["500 Euro", 500],
          ["EURO 500", 500],
          ["500 EURO", 500],
          ["75,00 eurot", 75],
          ["75,00 euro", 75],
          ["1.234,56 EUR", 1234.56],
          ["89.50 €", 89.5],
        ];
        for (const [text, expected] of cases) {
          expect(amounts(text, "eur"), `"${text}"`).toEqual([expected]);
        }
      });

      suite("G_RE — ühikuvariandid", () => {
        for (const text of [
          "10g",
          "10 g",
          "10G",
          "10gram",
          "10grammi",
          "10 gramm",
          "10 grammi",
          "10 Grammi",
          "10 grammides",
          "10 gram",
          "gramm 10",
          "grammi 10",
        ]) {
          expect(amounts(text, "g"), `"${text}"`).toEqual([10]);
        }
        // The second alternative has no bare "g", so a unit never precedes its
        // number — and "10g." does not swallow the sentence period.
        expect(amounts("g 10", "g"), "g ei eelne arvule").toEqual([]);
        expect(amounts("G 10", "g"), "G ei eelne arvule").toEqual([]);
        expect(raws("10g.", "g"), "reeglõpp ei neela punkti").toEqual(["10g"]);
      });

      suite("N_RE — kuupäevad, ajad ja asjanumbrid jäetakse välja", () => {
        for (const text of [
          "12.03.2024",
          "12/03/2024",
          "12-03-2024",
          "2024.03.12",
          "2024-03-12",
          "14:30",
          "9:05",
          "23:59",
          "nr 1-23/456",
          "1-23/456",
        ]) {
          expect(detect(text, "n").length, `"${text}"`).toEqual(0);
        }
        // A newline is not in the number class, so two lines never merge.
        expect(raws("500\n600", "n"), "kaks rida ei liitu").toEqual(["500", "600"]);
        // The tail of a hyphenated number is dropped: "-" is a lookbehind class.
        expect(raws("sõnum 555-1234", "n"), "kriipsu järel ei loeta").toEqual([
          "555",
        ]);
      });

      // ═════════════════════════════════════════════════════════════════════════════
      // NUMBER NORMALISATION
      // ═════════════════════════════════════════════════════════════════════════════
      suite("Numbrid — punkt on kümnenderaldaja", () => {
        // Not a thousands separator: this is one-two-point-three-four.
        expect(parseAmount("1.234"), "1.234 on 1,234").toBeCloseTo(1.234, 6);
        expect(countDecimals("1.234"), "1.234 kolm kohta").toEqual(3);
        // The thousands forms.
        expect(parseAmount("1 234,56"), "tühik tuhandeks").toBeCloseTo(
          1234.56,
          6,
        );
        expect(parseAmount("1.234,56"), "punkt tuhandeks").toBeCloseTo(
          1234.56,
          6,
        );
        expect(parseAmount("1,234.56"), "koma tuhandeks").toBeCloseTo(
          1234.56,
          6,
        );

        setMode("eur");
        expect(
          formatValue(1.234, 3),
          "1.234 kuvatakse kahe komakohaga",
        ).toContain("1,23");
        // Same rule downstream: ". " then a digit is still one decimal value,
        // so "100. 200 EUR" is a single 100.2 and renders as 100,20 €.
        expect(
          amounts("100. 200 EUR", "eur"),
          '"100. 200 EUR" on üks arv',
        ).toEqual([100.2]);
        expect(
          formatValue(sum("100. 200 EUR", "eur"), 3),
          "summa kuvatakse 100,20 €",
        ).toContain("100,20");
      });

      suite("parseAmount — vigased ja mitmetähenduslikud vormistused", () => {
        expect(parseAmount("1e3"), "teaduslik tähis").toBeCloseTo(1000, 6);
        expect(parseAmount(".5"), "puuduv täisarv").toBeCloseTo(0.5, 6);
        expect(parseAmount("1234."), "trailing punkt").toBeCloseTo(1234, 6);
        // Two separators is malformed input; parseFloat takes the first run.
        // Documented rather than guarded.
        expect(parseAmount("1.234.567"), "kaks punkti").toBeCloseTo(1.234, 6);
        expect(parseAmount("1,5,5"), "kaks koma").toBeCloseTo(1.5, 6);
        expect(parseAmount("1 234 567"), "mitu tühikut").toBeCloseTo(
          1234567,
          6,
        );
        expect(parseAmount("1.000.000,50"), "punkt+koma").toBeCloseTo(
          1000000.5,
          6,
        );
        expect(parseAmount("-50,50"), "miinusmärk").toBeCloseTo(-50.5, 6);
        expect(parseAmount("\u221250,50"), "U+2212 miinusmärk").toBeCloseTo(
          -50.5,
          6,
        );
        for (const bad of ["abc", "", ",", ".", "€", "-"]) {
          expect(parseAmount(bad), `"${bad}" → null`).toBeNull();
        }
      });

      suite("countDecimals — kooskõlas parseAmount-ga", () => {
        for (const raw of [
          "42",
          "1,56",
          "1.56",
          "1.234,56",
          "1 234,56",
          "0,0002",
          "-50,50",
          "\u221250,50",
          "1234.",
          "1.234",
        ]) {
          // Whatever the separator style, the reported precision must equal the
          // number of digits actually kept after it.
          const di = Math.max(raw.lastIndexOf(","), raw.lastIndexOf("."));
          const expected = di === -1 ? 0 : raw.length - di - 1;
          expect(countDecimals(raw), `"${raw}"`).toEqual(expected);
        }
        expect(parseAmount("-1 234,56"), "summad miinusega").toBeCloseTo(
          -1234.56,
          6,
        );
      });

      // ═════════════════════════════════════════════════════════════════════════════
      // FORMATTING
      // ═════════════════════════════════════════════════════════════════════════════
      suite("formatValue — ühiku ees on U+00A0, mitte tavaline tühik", () => {
        setMode("eur");
        const eur = formatValue(1234.56, 2);
        expect(eur, "sisaldab U+00A0 + €").toContain("\u00A0\u20AC");
        expect(eur.includes(" €"), "tavalist tühikut € ees pole").toEqual(
          false,
        );
        expect(/ \u20AC/.test(eur), "tavalist tühikut € ees pole").toEqual(false);
        setMode("g");
        expect(/ \u20AC/.test(formatValue(1.5, 1)), "g režiimis samuti").toEqual(
          false,
        );
        expect(formatValue(1.5, 1), "g ühik U+00A0").toContain("\u00A0g");
        setMode("n");
        expect(unitShort(), "n režiimis ühikut pole").toEqual("");
        expect(
          /[€g]$/.test(formatValue(42, 0)),
          "n režiimis numbri järel ühikut pole",
        ).toEqual(false);
      });

      suite("formatValue — komakohtade käitumine", () => {
        setMode("eur");
        // eur ignores the detected precision and always shows 2 places.
        expect(formatValue(0.5, 5), "eur sunnib 2 kohta").toEqual(
          formatValue(0.5, 2),
        );
        expect(formatValue(1234, 0), "eur täisarv → 2 kohta").toContain(
          ",00" + "\u00A0€",
        );
        setMode("g");
        expect(formatValue(0.0002, 4), "4 kohta g").toContain(",0002");
        // Precision is capped, so a long decimal cannot blow up the output.
        expect(
          formatValue(0.123456789012345, 99),
          "99 kohta → kõige rohkem 10",
        ).toHaveLength(
          formatValue(0.123456789012345, 10).length,
        );
      });

      suite("formatValue — ümardamine", () => {
        setMode("g");
        // IEEE-754 makes 1.005 slightly below the midpoint, so it rounds down.
        // Pinned so nobody "fixes" it into a different value by accident.
        expect(formatValue(1.005, 2), "1.005 @2").toEqual(
          new Intl.NumberFormat("et-EE", {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2,
          }).format(1.005) + "\u00A0g",
        );
        expect(formatValue(2.5, 0), "2.5 → 3").toContain("\u00A0g");
        expect(formatValue(3.5, 0), "3.5 → 4").toContain("\u00A0g");
        setMode("n");
        expect(formatValue(0.1 + 0.2, 1), "0.1+0.2 → 0,3").toContain(",3");
      });

      // ═════════════════════════════════════════════════════════════════════════════
      // RENDER
      // ═════════════════════════════════════════════════════════════════════════════
      const output = document.getElementById("output");
      output.innerHTML = "";

      let totalPass = 0,
        totalFail = 0;

      for (const s of suites) {
        const pass = s.tests.filter((t) => t.pass).length;
        const fail = s.tests.filter((t) => !t.pass).length;
        totalPass += pass;
        totalFail += fail;

        const div = document.createElement("div");
        div.className = "suite";

        div.innerHTML =
          '<div class="suite-title">// ' +
          s.name +
          ' <span style="color:var(--' +
          (fail ? "red" : "amber") +
          ')">' +
          pass +
          "/" +
          s.tests.length +
          "</span></div>";

        for (const t of s.tests) {
          const row = document.createElement("div");
          row.className = "test " + (t.pass ? "pass" : "fail");
          row.innerHTML =
            '<span class="test-icon">' +
            (t.pass ? "✓" : "✗") +
            "</span>" +
            '<span class="test-name">' +
            (t.label || "(silt puudub)") +
            "</span>" +
            '<span class="test-detail">' +
            (t.pass ? "" : "got " + t.got) +
            "</span>";
          if (!t.pass) {
            const extra = document.createElement("div");
            extra.className = "test-extra";
            extra.textContent = "oodati: " + t.expected;
            row.appendChild(extra);
          }
          div.appendChild(row);
        }
        output.appendChild(div);
      }

      // Summary
      const sumDiv = document.createElement("div");
      sumDiv.className = "summary";
      sumDiv.innerHTML =
        '<span class="summary-pass">✓ ' +
        totalPass +
        " läbis</span>" +
        (totalFail
          ? '<span class="summary-fail">✗ ' + totalFail + " ebaõnnestus</span>"
          : "") +
        '<span class="summary-total">' +
        (totalPass + totalFail) +
        " testi kokku</span>";
      output.appendChild(sumDiv);
    </script>
  </body>
</html>
