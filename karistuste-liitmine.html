<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karistuste liitmine | Õigusmasin</title>
    <link rel="stylesheet" href="noir.css" />
    <style>
      /* ── Page-specific styles ── */
      /* duration-row/field/sublabel live in noir.css */

      /* Result block — spans both columns (chrome & fade come from noir.css) */
      .result-block {
        grid-column: 1 / -1;
      }

      .result-unit {
        font-size: var(--fs-md);
        color: var(--muted);
        letter-spacing: var(--track-wide);
        margin-right: var(--sp-3);
      }

      /* Equation recap shown below the result */
      .result-equation {
        padding: var(--sp-2) var(--sp-6) var(--sp-3);
        font-size: var(--fs-xs);
        color: var(--dim);
        letter-spacing: var(--track-wide);
        border-top: 1px solid var(--border);
      }
      .result-equation span {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="app-shell">
      <!-- ── SIDEBAR ── -->
      <nav class="sidebar" id="sidebar"></nav>

      <!-- ── PAGE CONTENT ── -->
      <div class="page-content">
        <div class="topbar">
          <div class="header-main">
            <button
              class="sidebar-toggle"
              id="sidebar-toggle"
              aria-label="Ava menüü"
            >
              ☰
            </button>
            <div class="title-block">
              <h1>Karistuste liitmine</h1>
              <div class="subtitle">
                <span class="subtitle-label"
                  >Liidab kaks karistuse kestust</span
                >
              </div>
            </div>
          </div>
        </div>

        <main>
          <div class="tool-wrap">
            <!-- ── INPUT A ── -->
            <div class="panel">
              <div class="panel-header">// Esimene karistus</div>
              <div class="panel-body">
                <div class="duration-row">
                  <div class="duration-field">
                    <div class="duration-sublabel">Aastad</div>
                    <input class="field" type="number" id="a-years" value="0" min="0" />
                  </div>
                  <div class="duration-field">
                    <div class="duration-sublabel">Kuud</div>
                    <input class="field" type="number" id="a-months" value="0" min="0" />
                  </div>
                  <div class="duration-field">
                    <div class="duration-sublabel">Päevad</div>
                    <input class="field" type="number" id="a-days" value="0" min="0" />
                  </div>
                </div>
              </div>
            </div>

            <!-- ── INPUT B ── -->
            <div class="panel">
              <div class="panel-header">// Teine karistus</div>
              <div class="panel-body">
                <div class="duration-row">
                  <div class="duration-field">
                    <div class="duration-sublabel">Aastad</div>
                    <input class="field" type="number" id="b-years" value="0" min="0" />
                  </div>
                  <div class="duration-field">
                    <div class="duration-sublabel">Kuud</div>
                    <input class="field" type="number" id="b-months" value="0" min="0" />
                  </div>
                  <div class="duration-field">
                    <div class="duration-sublabel">Päevad</div>
                    <input class="field" type="number" id="b-days" value="0" min="0" />
                  </div>
                </div>
              </div>
            </div>

            <!-- ── RESULT ── -->
            <div class="result-block animate" id="result-block">
              <div class="result-header">
                <span class="result-label">// Kokku</span>
                <button class="copy-btn" id="copy-btn" style="display: none">
                  Kopeeri
                </button>
              </div>
              <div class="result-body result-body--inline" id="result-body">
                <span class="result-figure empty">—</span>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="nav.js"></script>
    <script>
      function val(id) {
        return Math.max(0, parseInt(document.getElementById(id).value) || 0);
      }

      function compute() {
        const ay = val("a-years"),
          am = val("a-months"),
          ad = val("a-days");
        const by = val("b-years"),
          bm = val("b-months"),
          bd = val("b-days");

        const totalDays = ad + bd;
        const carryMonths = Math.floor(totalDays / 30);
        const rDays = totalDays % 30;

        const totalMonths = am + bm + carryMonths;
        const carryYears = Math.floor(totalMonths / 12);
        const rMonths = totalMonths % 12;

        const rYears = ay + by + carryYears;

        return { rYears, rMonths, rDays, ay, am, ad, by, bm, bd };
      }

      function render() {
        const { rYears, rMonths, rDays } = compute();
        const body = document.getElementById("result-body");
        const copyBtn = document.getElementById("copy-btn");

        const parts = [];
        if (rYears > 0) parts.push([rYears, rYears === 1 ? "aasta" : "aastat"]);
        if (rMonths > 0) parts.push([rMonths, rMonths === 1 ? "kuu" : "kuud"]);
        if (rDays > 0) parts.push([rDays, rDays === 1 ? "päev" : "päeva"]);

        if (parts.length === 0) {
          body.innerHTML = `<span class="result-figure empty">—</span>`;
          copyBtn.style.display = "none";
        } else {
          body.innerHTML = parts
            .map(
              ([n, u]) =>
                `<span class="result-figure">${n}</span><span class="result-unit">${u}</span>`,
            )
            .join("");
          copyBtn.style.display = "";
          copyBtn._clipText = parts.map(([n, u]) => `${n}\u00A0${u}`).join(" ");
        }
      }

      document
        .getElementById("copy-btn")
        .addEventListener("click", function () {
          if (this.classList.contains("copied")) return;
          navigator.clipboard.writeText(this._clipText).then(() => {
            this.classList.add("copied");
            const orig = this.textContent;
            this.textContent = "✓";
            setTimeout(() => {
              this.textContent = orig;
              this.classList.remove("copied");
            }, 1800);
          });
        });

      const inputs = [
        "a-years",
        "a-months",
        "a-days",
        "b-years",
        "b-months",
        "b-days",
      ];
      inputs.forEach((id) => {
        const el = document.getElementById(id);
        el.addEventListener("input", render);
        el.addEventListener("change", render);
      });

      render();
    </script>
  </body>
</html>
