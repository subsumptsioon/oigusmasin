name: Update drug list data

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Only to close a release-candidate PR that was cut before this commit; see
  # the last step of the commit job.
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pdfplumber

      - name: Run scraper
        run: python scrape.py

      - name: Normalize JSON
        run: |
          python - << 'EOF'
          import json
          with open("data.json") as f:
              data = json.load(f)
          with open("data.json", "w") as f:
              json.dump(data, f, indent=2, sort_keys=True)
          EOF

      - name: Generate changelog and diff
        id: diff
        run: |
          python - << 'EOF'
          import json, subprocess, datetime, os

          def extract_names(data):
              # data.json is {"meta": ..., "lists": [{"substances": [{"et": ...}]}]},
              # not a bare list. Walking it as one returned the empty set, so
              # every changelog said "No changes" and every commit read +0 / -0.
              return {
                  s["et"]
                  for lst in data.get("lists", [])
                  for s in lst.get("substances", [])
              }

          def get_old():
              try:
                  content = subprocess.check_output(
                      ["git", "show", "HEAD:data.json"],
                      text=True
                  )
                  return json.loads(content)
              except:
                  return []

          def strip_generated(d):
              # meta.generated (ajatempel) muutub igal käivitamisel ja tekitab
              # tühje committe; ignoreerime seda muutuste tuvastamisel.
              if isinstance(d, dict):
                  meta = d.get("meta")
                  if isinstance(meta, dict):
                      meta = {k: v for k, v in meta.items() if k != "generated"}
                  return dict(d, meta=meta)
              return d

          # Semantiline võrdlus: muutunud ainult siis, kui sisu (v.a ajatempel)
          # on tegelikult erinev.
          payload_changed = (
              strip_generated(get_old())
              != strip_generated(json.load(open("data.json")))
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"changed={str(payload_changed).lower()}\n")

          old = extract_names(get_old())
          new = extract_names(json.load(open("data.json")))

          added = sorted(new - old)
          removed = sorted(old - new)

          summary = f"+{len(added)} / -{len(removed)}"

          # Write summary
          with open("diff.txt", "w") as f:
              f.write(summary)

          # Generate markdown changelog
          today = datetime.date.today().isoformat()

          lines = []
          lines.append(f"## Changes ({today})\n")

          if added:
              lines.append("### ➕ Added")
              for a in added:
                  lines.append(f"- {a}")
              lines.append("")

          if removed:
              lines.append("### ➖ Removed")
              for r in removed:
                  lines.append(f"- {r}")
              lines.append("")

          if not added and not removed:
              lines.append("No changes.\n")

          with open("changelog.md", "w") as f:
              f.write("\n".join(lines))

          print(summary)
          EOF

      - name: Commit updated data.json (only if changed)
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "false" ]; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SUMMARY=$(cat diff.txt)

          git add data.json
          git commit -m "chore: update data.json (${SUMMARY}) [skip ci]"
          git push
          # The release branch is regenerated from dev, so the same commit has to
          # land on both. Pushing to release alone would be reverted by the next
          # release run, and the live site would silently serve a stale list.
          git push origin HEAD:release

          # A release PR was cut from the tip *before* this commit. This repo
          # squash-merges, so merging it now would put the old data.json back
          # and the site would serve a stale list until the next nightly run.
          # Close it instead; the next Cut release rebuilds from here.
          # (branch name must match PR_BRANCH in tools/release.mjs)
          gh pr close release-candidate --delete-branch \
            --comment "data.json changed after this was cut — re-run Cut release." \
            || echo "no open release-candidate PR"

      - name: Show alert in UI
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "🚨 Drug list updated!"
          echo "Summary: $(cat diff.txt)"
          echo ""
          echo "Changes:"
          cat changelog.md

      - name: Upload changelog artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog.md
