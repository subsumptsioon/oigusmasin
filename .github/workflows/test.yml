name: Tests & static checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rehkendaja-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # rehkendaja-core.js uses duplicate named capture groups in the same
          # regex (valid in V8 >= Node 23 / modern browsers).
          node-version: "24"

      - name: Run Rehkendaja headless test suites
        run: node tools/run-rehkendaja-tests.mjs

      - name: Static asset / nav integrity check
        run: node tools/check-assets.mjs

      - name: Design-token WCAG contrast audit
        run: node tools/contrast-audit.mjs

      - name: CSS convention lint
        run: node tools/check-css.mjs

      - name: JS comment-stripper edge cases
        run: node tools/js-strip.test.mjs

  release-comments:
    runs-on: ubuntu-latest
    steps:
      # `release` carries site files only, so it has no workflow file of its own
      # and a push to it would fire nothing. The gate therefore runs from `dev`
      # against a checkout of the release branch.
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Checkout release
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: release
          path: release

      - name: Release branch carries no comments
        run: |
          # checkout creates the directory even when the ref is missing, so test
          # for a file the release tree must contain.
          if [ ! -f release/index.html ]; then
            echo "release branch does not exist yet — nothing to check."
            exit 0
          fi
          node tools/strip-comments.mjs --check --root release
