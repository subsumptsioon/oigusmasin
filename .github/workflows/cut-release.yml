name: Cut release

# Regenerates the `release` branch from `dev` and opens a PR for it. Manual, so
# a release is a deliberate act — but one button rather than remembering to run
# a command, which is how the site silently drifts from `dev`.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The DOM gate launches a real browser; `chromium` is not a name any
      # GitHub runner ships it under.
      - name: Install Chromium
        uses: browser-actions/setup-chromium@v1
        with:
          install-method: system

      - name: Build, gate, and open the release PR
        run: node tools/release.mjs --push
        env:
          GH_TOKEN: ${{ github.token }}
